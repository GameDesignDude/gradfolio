email: dereklmanns@gmail.com

# Pagination
paginate: 4
permalink: /blog/:year/:title/
paginate_path: /blog/page:num/

# Social media links in footer
twitter: "https://twitter.com/GameDesignDude"
linkedin: "derekmanns"
//stackoverflow: "#"
github: "https://github.com/GameDesignDude"
researchgate: "https://www.researchgate.net/profile/Derek-Manns?ev=hdr_xprf"
orcid: "https://orcid.org/0009-0008-3081-6357"
//quora: "#"
//instagram: "GameDesignDude"
//facebook: "#"


# Markdown
highlighter: rouge
markdown: kramdown

# Tracker
analytics:

# optimization -> compress.html
compress_html:
  clippings: [html,div, p, ul, td, h1, h2, h3, h4,link, meta, footer, nav, img, header, hr, br, head, style, li, ul, ol, time, main, script, title]
  comments: ["<!-- ", " -->"]
  endings: [all]
  ignore:
    envs: [local]
  blanklines: false
  profile: false
  startings: []

#collection
collections:
  projects:
    output: true
    permalink: /projects/:name/
    order:
      - bitsy.md
      - borksy.md
      - scalar.md
      - twine.md
      - twitterbot.md
      - discord.md

sass:
  sass_dir: /assets/css/_sass
  style: compressed

include:
  - _pages

exclude:
  - README.md
  - LICENSE.md

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-email-protect
  - jekyll-target-blank
